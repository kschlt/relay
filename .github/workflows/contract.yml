name: contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest interpreters the suite claims to support, plus
        # one in between. An adapter author should not have to match a version.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the contract suite with nothing installed
        run: python -m unittest discover -s tests -t . -v
      - name: Run the conformance CLI over the fixture corpus
        run: python -m relay_intake.conformance fixtures/valid

  cross-check:
    # Confirms the published JSON Schema never rejects what the reference
    # validator accepts. Needs a third-party validator, so it is its own job
    # rather than a dependency of the suite above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install jsonschema==4.26.0
      - run: python -m unittest tests.test_schema_document -v
